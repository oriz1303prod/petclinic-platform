apiVersion: v1
kind: ConfigMap
metadata:
  name: vets-service-config
  namespace: petclinic-dev  # base default; the overlays set the real namespace
  labels:
    app.kubernetes.io/name: vets-service
    app.kubernetes.io/part-of: petclinic
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: service
data:
  CONFIG_SERVER_URL: http://config-server:8888
  SPRING_DATASOURCE_URL: "jdbc:mysql://REPLACE_WITH_RDS_ENDPOINT:3306/petclinic"  # set per environment by the overlays
