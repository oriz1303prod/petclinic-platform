# ServiceAccount the ClusterSecretStore authenticates with (PETPLAT-34, PETPLAT-37).
# The role ARN comes from the Terraform output eso_role_arn; scripts/install-eso.sh fills:
#   ${ESO_ROLE_ARN}
# The controller requests a short-lived token for this account (jwt auth) and trades it for the
# IRSA role, so the account does not need a mounted token itself.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets-sa
  namespace: external-secrets
  labels:
    app.kubernetes.io/name: external-secrets-sa
    app.kubernetes.io/part-of: petclinic
    app.kubernetes.io/managed-by: kubectl
    app.kubernetes.io/component: infrastructure
  annotations:
    eks.amazonaws.com/role-arn: "${ESO_ROLE_ARN}"
automountServiceAccountToken: false
