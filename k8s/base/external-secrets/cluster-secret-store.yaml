# ClusterSecretStore for AWS Secrets Manager (PETPLAT-34).
# API version is v1: ESO v2.14.0 no longer serves v1beta1 (the technical spec was updated).
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
  labels:
    app.kubernetes.io/name: aws-secrets-manager
    app.kubernetes.io/part-of: petclinic
    app.kubernetes.io/managed-by: kubectl
    app.kubernetes.io/component: infrastructure
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets-sa
            namespace: external-secrets
            # No audiences here: ESO already requests aud = sts.amazonaws.com (what the IRSA trust
            # policy needs). Listing it again makes the token carry two audiences and STS rejects it.
