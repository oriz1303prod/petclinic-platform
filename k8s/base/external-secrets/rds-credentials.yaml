# ExternalSecret for the RDS credentials (PETPLAT-35).
# Dev values (namespace petclinic-dev, secret petclinic/dev/...); apply with plain kubectl:
#   kubectl apply -f k8s/base/external-secrets/rds-credentials.yaml
# For prod, copy the file and change the namespace and the remoteRef keys.
# Secrets Manager holds one JSON secret {"username":"...","password":"..."}; each key is extracted
# with remoteRef.property into a Kubernetes Secret named rds-credentials.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rds-credentials
  namespace: petclinic-dev
  labels:
    app.kubernetes.io/name: rds-credentials
    app.kubernetes.io/part-of: petclinic
    app.kubernetes.io/managed-by: kubectl
    app.kubernetes.io/component: backend
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: rds-credentials
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: petclinic/dev/rds-credentials
        property: username
    - secretKey: password
      remoteRef:
        key: petclinic/dev/rds-credentials
        property: password
