# vets-service: vet data, needs MySQL.
# `production` is added on purpose: the Caffeine cache is gated on @Profile("production"), and this
# setting replaces the profile list from application.yml.
serviceName: vets-service
component: service
service:
  port: 8083
springProfiles: docker,mysql,production

image:
  name: vets-service
  tag: v1.0.0

config:
  CONFIG_SERVER_URL: http://config-server:8888

database:
  enabled: true

secrets:
  - name: SPRING_DATASOURCE_USERNAME
    secretName: rds-credentials
    key: username
  - name: SPRING_DATASOURCE_PASSWORD
    secretName: rds-credentials
    key: password

initContainers:
  - name: wait-for-config-server
    url: http://config-server:8888/actuator/health
  - name: wait-for-discovery-server
    url: http://discovery-server:8761/actuator/health
